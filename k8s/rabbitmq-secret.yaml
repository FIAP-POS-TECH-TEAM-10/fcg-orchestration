# Modelo do Secret (cluster local Kind/Docker Desktop). NÃO coloque valores aqui: crie o Secret real com
#   kubectl create secret generic rabbitmq-secret -n fcgames \
#     --from-literal=username="$RABBITMQ_USER" --from-literal=password="$RABBITMQ_PASS"
# (o arquivo continua versionado só porque k8s/validate.sh valida o formato).
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: fcgames
type: Opaque
stringData:
  username: REPLACE_ME
  password: REPLACE_ME
