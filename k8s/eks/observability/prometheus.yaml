# Prometheus do FCGames: só dentro do cluster (Service ClusterIP, SEM Ingress).
# Config vem do ConfigMap prometheus-config (gerado em ../kustomization.yaml a partir de prometheus.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {} # efêmero, igual ao SQLite; a retenção curta mantém o uso baixo
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.3
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          # Medido no ciclo real: ~35Mi em uso com 2 targets; request baixo para sobrar espaço nos 2x t3.small.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
