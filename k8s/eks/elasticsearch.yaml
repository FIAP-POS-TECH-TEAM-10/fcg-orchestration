# Índice de busca do catalog (/buscaJogos). Só acessível dentro do cluster; sem persistência:
# o índice é recriado a cada "Ligar" e repovoado ao criar/atualizar jogos (POST/PUT /jogos).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
spec:
  replicas: 1
  strategy:
    type: Recreate # nodes pequenos: não cabem dois pods de ES ao mesmo tempo
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false" # sem rota no Ingress: acesso só pelo Service interno
            - name: xpack.ml.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: -Xms256m -Xmx256m
          resources:
            requests:
              memory: 640Mi
              cpu: 100m
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
