# Serviços do FCGames no EKS (fcg-eks). Aplicado pelo scripts/eks-up.sh:
#   kubectl apply -k k8s/eks
# O namespace, as ServiceAccounts (Pod Identity) e o Secret fcg-jwt vêm do Terraform
# (infra/eks) — não são declarados aqui.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fcgames

resources:
  - redis.yaml
  - users-api.yaml
  - catalog-api.yaml
  - payments-api.yaml
  - observability/prometheus.yaml
  - observability/grafana.yaml
  - ingress.yaml

# Gera o ConfigMap fcg-config com sufixo de hash: mudar config.env dispara rollout.
configMapGenerator:
  - name: fcg-config
    envs:
      - config.env
  # Observabilidade: config entra por ConfigMap (imagens oficiais, sem pipeline de imagem).
  # A chave (antes do "=") é o nome do arquivo montado no container.
  - name: prometheus-config
    files:
      - prometheus.yml=observability/prometheus.yml
  - name: grafana-datasources
    files:
      - datasource.yml=observability/grafana-datasource.yml
  - name: grafana-dashboards-provider
    files:
      - dashboards.yml=observability/grafana-dashboards-provider.yml
  - name: grafana-dashboards
    files:
      - fcgames-observability.json=observability/fcgames-observability.json
