apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  labels:
    app: users-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Sem downtime: sobe o pod novo, espera ficar Ready (inclui o readiness gate do ALB),
  # só então derruba o antigo.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
    spec:
      serviceAccountName: users-api # Pod Identity → role fcg-eks-users-api (SQS/SNS)
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          emptyDir: {} # SQLite efêmero (decisão do time)
      containers:
        - name: api
          image: 915153720516.dkr.ecr.sa-east-1.amazonaws.com/fcg-users-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - configMapRef:
                name: fcg-config
          env:
            - name: ASPNETCORE_URLS
              value: http://+:5001
            - name: ConnectionStrings__DefaultConnection
              value: Data Source=/data/users.db
            - name: JWT__KEY
              valueFrom:
                secretKeyRef:
                  name: fcg-jwt
                  key: jwt-key
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: 15 # continua atendendo enquanto o ALB retira o target
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
spec:
  selector:
    app: users-api
  ports:
    - name: http
      port: 80
      targetPort: http
