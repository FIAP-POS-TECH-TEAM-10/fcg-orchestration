apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  labels:
    app: catalog-api
spec:
  replicas: 1 # sem HPA: cada réplica teria seu próprio SQLite (ver spec)
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      serviceAccountName: catalog-api # Pod Identity → SQS/SNS + DynamoDB (Jogos, Desejos)
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          emptyDir: {} # SQLite compartilhado entre api e worker (Pedidos, Bibliotecas)
      containers:
        - name: api
          image: 915153720516.dkr.ecr.sa-east-1.amazonaws.com/fcg-catalog-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5002
          envFrom:
            - configMapRef:
                name: fcg-config
          env:
            - name: ASPNETCORE_URLS
              value: http://+:5002
            - name: ConnectionStrings__DefaultConnection
              value: Data Source=/data/catalog.db
            - name: ConnectionStrings__Redis
              value: redis:6379
            - name: DynamoDb__Region
              value: sa-east-1
            - name: DynamoDb__ServiceUrl
              value: "" # vazio = DynamoDB real da AWS (não o dynamodb-local)
            - name: JWT__KEY
              valueFrom:
                secretKeyRef:
                  name: fcg-jwt
                  key: jwt-key
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: 15
        # Consumers MassTransit (UsuarioCriado, PagamentoProcessado). Mesmo pod da API para
        # enxergar o mesmo SQLite. API e worker rodam Database.Migrate(); o EF Core 10 serializa
        # via __EFMigrationsLock — no pior caso o worker reinicia uma vez.
        - name: worker
          image: 915153720516.dkr.ecr.sa-east-1.amazonaws.com/fcg-catalog-service:worker-latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: fcg-config
          env:
            - name: ConnectionStrings__DefaultConnection
              value: Data Source=/data/catalog.db
            - name: DynamoDb__Region
              value: sa-east-1
            - name: DynamoDb__ServiceUrl
              value: ""
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 96Mi
              cpu: 25m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
spec:
  selector:
    app: catalog-api
  ports:
    - name: http
      port: 80
      targetPort: http
