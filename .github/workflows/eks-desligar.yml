# Botão "Desligar cluster EKS" (scripts/eks-down.sh) + desligamento automático toda noite às
# 03:00 (BRT), caso alguém tenha esquecido o cluster ligado. Com o cluster já desligado o eks-down
# não destrói nada (state vazio) — e limpa sobras de um Ligar que falhou.
name: Desligar cluster EKS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 03:00 BRT

# Mesmo grupo do "Ligar cluster EKS": nunca rodam ao mesmo tempo.
concurrency:
  group: eks-cluster
  cancel-in-progress: false

permissions:
  id-token: write # OIDC com a AWS
  contents: read

jobs:
  desligar:
    name: Desligar cluster (eks-down)
    runs-on: ubuntu-latest
    environment: aws-eks # só a branch main pode usar (trust da role exige este environment)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Login na AWS (OIDC → GitHubActions-EKS-Admin)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::915153720516:role/GitHubActions-EKS-Admin
          role-duration-seconds: 7200
          aws-region: sa-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: "~1.15"

      - name: Desligar (scripts/eks-down.sh)
        run: |
          set -o pipefail
          ./scripts/eks-down.sh | tee eks-down.log

      - name: Resumo
        if: success()
        run: |
          {
            if grep -q "Resources: 0 destroyed" eks-down.log; then
              echo "### 💤 Nada a fazer: o cluster \`fcg-eks\` já estava desligado"
            else
              echo "### 🛑 Cluster \`fcg-eks\` desligado"
            fi
            echo '```'
            grep -E "Destroy complete|ATENÇÃO|aws elbv2 delete|Clusters EKS" eks-down.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Aviso de falha
        if: failure()
        run: |
          {
            echo "### ⚠️ O desligar falhou — o cluster pode continuar LIGADO (cobrando)"
            echo "Veja o log do passo \"Desligar\". Para destravar: rode \`./scripts/eks-down.sh\` de uma máquina com o profile \`fcg-team\` (ou rode este workflow de novo)."
          } >> "$GITHUB_STEP_SUMMARY"
